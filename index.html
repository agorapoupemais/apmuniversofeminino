<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APM | Universo Feminino</title>

  <!-- Preload fonts and critical hero image -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE STYLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-color: #0b0b0e;
      --card-bg: #13131a;
      --text-main: #ffffff;
      --text-sub: #c5c5d0;
      --accent-pink: #ff2a85;
      --whatsapp-green: #00e676;
      --whatsapp-green-hover: #00c853;
      --whatsapp-shadow: rgba(0, 230, 118, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* MAIN CONTAINER - HIGH CONVERSION SINGLE SCREEN */
    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 20px 20px;
      background: radial-gradient(circle at top center, #1f1424 0%, #0b0b0e 70%);
      position: relative;
    }

    /* LOGO SECTION */
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 4px;
      padding-bottom: 8px;
    }

    .logo-img {
      width: auto;
      height: 72px;
      max-height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    /* HERO IMAGE SECTION */
    .hero-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 42vh;
      margin: 6px 0;
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: cover;
      object-position: top center;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* CONTENT SECTION */
    .content-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.18rem;
      font-weight: 800;
      line-height: 1.28;
      color: #ffffff;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .subphrase {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text-sub);
      padding: 0 8px;
    }

    /* CTA BUTTON SECTION */
    .cta-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .btn-whatsapp {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 200%);
      background-color: var(--whatsapp-green);
      color: #04200c;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      padding: 16px 12px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--whatsapp-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      letter-spacing: -0.01em;
    }

    .btn-whatsapp:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px var(--whatsapp-shadow);
    }

    .microcopy {
      font-size: 0.78rem;
      font-weight: 500;
      color: #9e9ea7;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      letter-spacing: 0.01em;
    }

    /* DESKTOP OPTIMIZATION */
    @media (min-width: 768px) {
      body {
        background-color: #050507;
      }
      .app-viewport {
        max-width: 860px;
        min-height: auto;
        height: auto;
        padding: 40px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
        margin: 40px auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr auto;
        column-gap: 40px;
        row-gap: 20px;
        align-items: center;
      }

      .logo-container {
        grid-column: 1 / -1;
        padding-bottom: 10px;
      }

      .logo-img {
        height: 88px;
      }

      .hero-container {
        grid-column: 1;
        height: 100%;
        max-height: 440px;
        margin: 0;
      }

      .hero-img {
        max-height: 440px;
      }

      .desktop-right-col {
        grid-column: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        text-align: left;
      }

      .content-box {
        text-align: left;
        align-items: flex-start;
        gap: 14px;
      }

      .headline {
        font-size: 1.45rem;
      }

      .subphrase {
        font-size: 0.98rem;
        padding: 0;
      }

      .cta-container {
        align-items: flex-start;
        margin-top: 0;
      }

      .btn-whatsapp {
        font-size: 1.1rem;
        padding: 18px 20px;
      }

      .microcopy {
        justify-content: flex-start;
        font-size: 0.82rem;
      }
    }
  </style>

  <!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1322609486391652');
fbq('track', 'PageView');

const WHATSAPP_URL = "https://chat.whatsapp.com/In81ZPCWcgh1ACUqBfVO8u";

function handleWhatsAppClick(e) {
  if (e) e.preventDefault();

  fbq('track', 'Lead');

  setTimeout(function() {
    window.location.href = WHATSAPP_URL;
  }, 300);
}
</script>
</head>
<body>

  <main class="app-viewport">
    
    <!-- LOGO -->
    <header class="logo-container">
      <img src="logo.png" alt="APM | Universo Feminino" class="logo-img">
    </header>

    <!-- IMAGEM DA MULHER COM PRODUTOS -->
    <section class="hero-container">
      <picture>
        <source srcset="hero.jpg" type="image/webp">
        <img src="hero.jpg" alt="Mulher com produtos e achadinhos" class="hero-img">
      </picture>
    </section>

    <!-- DESKTOP RIGHT CONTAINER / MOBILE FLOW -->
    <div class="desktop-right-col">
      <!-- HEADLINE & FRASE -->
      <section class="content-box">
        <h1 class="headline">ANTES DE COMPRAR, VEJA O QUE PODE ESTAR MAIS BARATO 👀</h1>
        <p class="subphrase">Ofertas, cupons e achadinhos de moda, beleza, casa, acessórios e muito mais.</p>
      </section>

      <!-- BOTÃO DO WHATSAPP & MICROCOPY -->
      <section class="cta-container">
        <button class="btn-whatsapp" onclick="handleWhatsAppClick(event)">
          QUERO VER OS ACHADINHOS 💚
        </button>
        <p class="microcopy">🔒 Entrada gratuita • WhatsApp</p>
      </section>
    </div>

  </main>

</body>
</html>
